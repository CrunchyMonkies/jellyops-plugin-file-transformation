name: Build & Publish Plugin Image

# Repackages upstream File Transformation's published release artifact
# (IAmParadox27/jellyfin-plugin-file-transformation, Release-<jellyfin>.zip) plus docker/meta.json
# into a FROM-scratch image-volume payload and pushes it to GHCR (provenance disabled so the
# kubelet mounts it cleanly as an image volume). Nothing is compiled. Mirrors docker/build-push.sh.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ft_tag:
        description: "Upstream File Transformation release tag to package"
        required: true
        default: "3.0.2.0"
      ft_asset:
        description: "Release asset (zip) to package"
        required: true
        default: "Release-12.2.0.zip"
      ft_sha256:
        description: "Expected SHA-256 of the asset (must match the pinned default unless changed together)"
        required: true
        default: "b267dc0e09154f242ef9d3201a6ed4fd1dc9594da42ff133400b0ed4ca10b859"

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}/plugin
  FT_REPO: IAmParadox27/jellyfin-plugin-file-transformation
  FT_TAG: ${{ github.event.inputs.ft_tag || '3.0.2.0' }}
  FT_ASSET: ${{ github.event.inputs.ft_asset || 'Release-12.2.0.zip' }}
  FT_SHA256: ${{ github.event.inputs.ft_sha256 || 'b267dc0e09154f242ef9d3201a6ed4fd1dc9594da42ff133400b0ed4ca10b859' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download & verify upstream release payload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${FT_TAG}" --repo "${FT_REPO}" --pattern "${FT_ASSET}" --dir . --clobber
          echo "${FT_SHA256}  ${FT_ASSET}" | sha256sum -c -
          mkdir -p plugin
          unzip -o -q "${FT_ASSET}" -d plugin
          cp docker/meta.json plugin/meta.json
          test -f plugin/Jellyfin.Plugin.FileTransformation.dll
          leaked="$(find plugin -maxdepth 1 -type f \( -name 'Emby.*' -o -name 'MediaBrowser.*' \
            -o \( -name 'Jellyfin.*' -a ! -name 'Jellyfin.Plugin.FileTransformation*' \) \))"
          if [ -n "$leaked" ]; then
            echo "forbidden assemblies in payload:" >&2; echo "$leaked" >&2; exit 1
          fi
          echo "Payload:"; ls -1 plugin

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=tag
            type=raw,value=${{ env.FT_TAG }}
            type=raw,value=latest

      - name: Build & push (provenance disabled)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.plugin
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Summary
        run: |
          {
            echo "### File Transformation plugin image published"
            echo ""
            echo "- Payload: \`${FT_REPO}\` @ \`${FT_TAG}\` / \`${FT_ASSET}\` (sha256 \`${FT_SHA256}\`)"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
            echo ""
            echo "Pin in \`k8s/30-jellyfinplugin.yaml\` (spec.pluginImage.reference):"
            echo ""
            echo '```'
            echo "${IMAGE}@${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
